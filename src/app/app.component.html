<ion-app>
  <ion-split-pane contentId="main-content" [disabled]="!mostrarMenu">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!mostrarMenu">
      <ion-content>
        <nav aria-label="Menú principal">
          <ion-list>
            <ion-menu-toggle autoHide="false">
              <ion-item routerLink="/inicio" routerDirection="root" lines="none" button>
                <ion-icon slot="start" name="home-outline" aria-hidden="true"></ion-icon>
                <ion-label>Inicio</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle autoHide="false">
              <ion-item routerLink="/registros" routerDirection="root" lines="none" button>
                <ion-icon slot="start" name="list-outline" aria-hidden="true"></ion-icon>
                <ion-label>Registros</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <!-- Solo el administrador ve el dashboard -->
            @if (esAdmin) {
              <ion-menu-toggle autoHide="false">
                <ion-item routerLink="/dashboard" routerDirection="root" lines="none" button>
                  <ion-icon slot="start" name="stats-chart-outline" aria-hidden="true"></ion-icon>
                  <ion-label>Dashboard</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }

            <ion-item lines="none" button (click)="salir()">
              <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-list>
        </nav>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
